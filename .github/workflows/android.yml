# Builds the Android app (android/) when it or the CapsuleOS version changes, and
# keeps the APK as a download on the run. Releases attach it in release.yml.
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', 'panalume/config.yaml', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'panalume/config.yaml', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: capsuleos-apk
          path: android/app/build/outputs/apk/release/*.apk
